# Mirrors the repository's file list onto the rolling `latest-build` release —
# the page the owner downloads from in a browser on the work machine.
#
# Runs on every push to main, i.e. every time the source repository's
# publish workflow pushes a fresh set of packages here (a deploy-key push
# does trigger workflows; only pushes made with the default GITHUB_TOKEN
# don't). Assets are replaced in place, so the
# .../releases/download/latest-build/... URLs never change, and the release
# notes are rewritten with the build date and a version table, so the page
# says at a glance whether the packages are newer than what is installed.
#
# This lives here, not in the source repository, because the deploy key the
# publisher uses can only do git — it cannot reach the Releases API. This
# repository's own GITHUB_TOKEN can, with no extra secret to manage.
name: refresh-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: latest-build

concurrency:
  group: refresh-release
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the release from the file list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f versions.txt ]]; then
            echo "versions.txt not found — nothing to publish" >&2
            exit 1
          fi
          mkdir -p staged
          cp versions.txt staged/
          for f in *.vsix all-extensions.zip build-and-install.sh skills.zip; do
            [[ -e "$f" ]] && cp "$f" staged/
          done
          built_at="$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M' HEAD) UTC"
          source_note="$(git log -1 --format=%s HEAD)"
          {
            echo "Automatyczny build wszystkich rozszerzeń ze źródeł, odświeżany po każdej zmianie."
            echo
            echo "**Zbudowano:** $built_at · $source_note"
            echo
            echo "| Rozszerzenie | Wersja | Plik |"
            echo "|---|---|---|"
            while IFS='|' read -r dir id ver file; do
              echo "| $id | $ver | [\`$file\`](https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$file) |"
            done < versions.txt
            echo
            echo "**Instalacja na maszynie bez sieci dla skryptów:** pobierz \`all-extensions.zip\`,"
            echo "rozpakuj i uruchom \`bash build-and-install.sh --local\` — zainstaluje leżące"
            echo "obok \`.vsix\`, pomijając to, co już aktualne. Pojedynczą paczkę można też"
            echo "zainstalować ręcznie (**Extensions → … → Install from VSIX…**)."
          } > "$RUNNER_TEMP/release-notes.md"
          # The date in the release header is its publish date — replacing
          # assets does not touch it, so an updated release would keep
          # looking N hours old and the owner would read that as "no new
          # packages". Recreating the release on every refresh keeps that
          # date honest. The download URLs survive recreation: they are
          # addressed by tag, and the tag is recreated with the release.
          # Old assets cannot linger either — the new release starts empty.
          #
          # The order matters: the replacement is fully staged as a draft
          # (all assets uploaded) BEFORE the old release goes away, so the
          # public page is without a release for seconds, not for the whole
          # upload — the owner once caught the gap mid-download. The delete
          # is also verified by reading back instead of trusting the call's
          # exit code: a transient 502 once deleted the release server-side
          # yet failed the step, leaving no release at all.
          api="repos/$GITHUB_REPOSITORY/releases"

          # A draft left behind by an interrupted earlier run would pile up
          # forever — sweep ours before staging a new one.
          for id in $(gh api "$api?per_page=100" --jq ".[] | select(.draft and .tag_name==\"$RELEASE_TAG\") | .id"); do
            gh api -X DELETE "$api/$id" >/dev/null 2>&1 || true
          done

          gh release create "$RELEASE_TAG" staged/* --draft --target "$GITHUB_SHA" \
            --title "Latest build" --notes-file "$RUNNER_TEMP/release-notes.md"
          draft_id="$(gh api "$api?per_page=100" --jq "[.[] | select(.draft and .tag_name==\"$RELEASE_TAG\")][0].id")"
          if [[ -z "$draft_id" || "$draft_id" == "null" ]]; then
            echo "szkic release'u nie powstal" >&2
            exit 1
          fi

          old_id="$(gh api "$api/tags/$RELEASE_TAG" --jq .id 2>/dev/null || true)"
          if [[ -n "$old_id" ]]; then
            deleted=""
            for attempt in 1 2 3; do
              gh api -X DELETE "$api/$old_id" >/dev/null 2>&1 || true
              if ! gh api "$api/$old_id" >/dev/null 2>&1; then
                deleted=yes
                break
              fi
              sleep 5
            done
            if [[ -z "$deleted" ]]; then
              echo "nie udalo sie usunac starego release'u ($old_id)" >&2
              exit 1
            fi
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" >/dev/null 2>&1 || true

          gh api -X PATCH "$api/$draft_id" -F draft=false \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" >/dev/null
          echo "Release $RELEASE_TAG odswiezony"
